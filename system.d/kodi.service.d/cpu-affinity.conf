# Keep Kodi on the A73 cluster.
#
# The S922X is big.LITTLE: cpu0-1 are A53 at 1.8GHz, cpu2-5 are A73 at 2.2GHz.
# The scheduler moved emulator threads onto the little cores - GameLoop was seen
# on cpu1 and a Main thread lived on cpu0 - and PSP emulation skipped audio and
# video together roughly every three seconds. Kodi uses about 2.4 cores of the
# four here, so nothing is lost by keeping it off the slow pair.
#
# Confirmed by pinning the running process: the skipping largely stopped.
[Service]
CPUAffinity=2 3 4 5
